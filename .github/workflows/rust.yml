name: Rust CI

on:
  push:
    branches: [main]
  # `dev` is the integration branch feature PRs target, so the gate has to run
  # there too. `main` stays listed so the eventual dev-to-main PR is gated the
  # same way.
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

# One in-flight run per branch: pushing a fixup to a PR cancels the superseded
# run instead of leaving both to finish. Matters most for the macos-latest job,
# which bills at 10x the Linux rate and compiles the whole tonic/prost tree.
# Pushes to main are exempt, so every commit on the default branch keeps its own
# pass/fail status for bisecting and release gating.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# No step in either job writes to the repository, so drop the default
# GITHUB_TOKEN grant to read-only. Least privilege is the other half of the
# SHA-pinning below: it bounds what a compromised third-party action can do.
permissions:
  contents: read

# Actions are pinned to full commit SHAs (with the human-readable version in a
# trailing comment) so a retagged release cannot silently change what CI runs.
# Dependabot's github-actions ecosystem keeps these pins current.
jobs:
  ci:
    name: Build, test, and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (stable, with clippy and rustfmt)
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          components: clippy, rustfmt
          rustflags: ""
          # This action bundles Swatinem/rust-cache; disable it so the explicit
          # cache step below is the single source of caching.
          cache: false

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: . -> target

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo build
        run: cargo build

      - name: cargo test
        run: cargo test

  macos:
    name: Build, test, and lint (macOS, --features apple)
    runs-on: macos-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (stable, with clippy)
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          components: clippy
          rustflags: ""
          cache: false

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: . -> target
          key: apple

      # crates/apple-container's build script runs tonic-build, which shells
      # out to `protoc`. macOS runners do not ship it, and the ubuntu job never
      # compiles this crate, so this is the only job that needs it.
      - name: Install protoc
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install protobuf

      # Covers the macOS-only Apple Containers path gated behind
      # #[cfg(all(target_os = "macos", feature = "apple"))], which the
      # ubuntu-latest job never compiles.
      - name: cargo build --features apple
        run: cargo build --features apple

      # `--workspace` so crates/apple-container's own tests run too. Without
      # it cargo only tests the root package, and the containerList decode
      # regression tests for issue #4 (crates/apple-container/src/models.rs)
      # never execute. The ubuntu job cannot use --workspace: it has no protoc,
      # which that crate's build script needs.
      - name: cargo test --workspace --features apple
        run: cargo test --workspace --features apple

      # `-p devcontainer --no-deps` scopes the gate to the root package, so
      # src/runtime/apple.rs is linted while crates/apple-container is only
      # built as a dependency. That crate has outstanding lints under
      # -D warnings; cleaning it up is out of scope for this issue, so it stays
      # excluded here rather than blocking this gate.
      - name: cargo clippy --features apple
        run: cargo clippy -p devcontainer --features apple --all-targets --no-deps -- -D warnings

  # Live end-to-end tests against a real container daemon, one leg per backend.
  # Docker is preinstalled on the runner; Podman runs rootless after an apt
  # install and a user service to publish its API socket. `needs: ci` keeps the
  # slow, network-dependent legs from starting when the fast gate already
  # failed, and `fail-fast: false` still reports both backends in one run.
  e2e:
    name: e2e (${{ matrix.runtime }})
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (stable)
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          rustflags: ""
          cache: false

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: . -> target
          key: e2e-${{ matrix.runtime }}

      # Rootless Podman needs a runtime dir it owns and a running API service;
      # neither is present on a fresh runner. Use a path under $HOME rather than
      # depending on /run/user/<uid>, and log events to a file because the
      # runner has no systemd user session for journald. XDG_RUNTIME_DIR is
      # persisted to later steps so `dev` finds the socket where it probes.
      - name: Set up Podman
        if: matrix.runtime == 'podman'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman
          export XDG_RUNTIME_DIR="$HOME/.xdg-runtime"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          mkdir -p "$XDG_RUNTIME_DIR/podman"
          chmod 700 "$XDG_RUNTIME_DIR"
          mkdir -p "$HOME/.config/containers"
          printf '[engine]\nevents_logger = "file"\n' > "$HOME/.config/containers/containers.conf"
          podman system service --time=0 "unix://$XDG_RUNTIME_DIR/podman/podman.sock" &
          for _ in $(seq 1 30); do
            if [ -S "$XDG_RUNTIME_DIR/podman/podman.sock" ]; then
              exit 0
            fi
            sleep 1
          done
          echo "Podman API socket did not appear" >&2
          podman info >&2 || true
          exit 1

      - name: Run runtime e2e tests
        env:
          DEV_E2E_RUNTIME: ${{ matrix.runtime }}
        run: cargo test --test runtime_e2e -- --test-threads=1
