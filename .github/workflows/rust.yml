name: Rust CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Build, test, and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Rust toolchain (stable, with clippy)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: cargo check
        run: cargo check

      - name: cargo build
        run: cargo build

      - name: cargo test
        run: cargo test

      #- name: cargo clippy
      #  run: cargo clippy

  release:
    name: Release Build
    runs-on: ${{ matrix.os }}
    if: true # Temporarily set to true for testing in PR
    needs: ci
    env:
      RUSTFLAGS: "" # Clear global -D warnings to allow release build test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            args: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            args: "--features apple"
          - os: macos-latest
            target: aarch64-apple-darwin
            args: "--features apple"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install cross-compilation toolchain (Linux ARM)
        if: matrix.os == 'ubuntu-latest' && endsWith(matrix.target, 'aarch64-unknown-linux-gnu')
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Install protobuf (macOS apple feature)
        if: matrix.os == 'macos-latest' && contains(matrix.args, 'apple')
        run: brew install protobuf

      - name: Build Release
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-latest" ] && [[ "${{ matrix.target }}" == *"aarch64-unknown-linux-gnu" ]]; then
            cross build --release --target ${{ matrix.target }} ${{ matrix.args }}
          else
            cargo build --release --target ${{ matrix.target }} ${{ matrix.args }}
          fi

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: dev-bin-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/dev
