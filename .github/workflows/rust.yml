name: Rust CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Build, test, and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable, with clippy)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: cargo check
        run: cargo check

      - name: cargo build
        run: cargo build

      - name: cargo test
        run: cargo test

      - name: cargo clippy
        run: cargo clippy -- -D warnings

  release:
    name: Release Build
    runs-on: ${{ matrix.os }}
    if: true # Temporarily set to true for testing in PR
    needs: ci
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            args: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            args: "--features apple"
          - os: macos-latest
            target: aarch64-apple-darwin
            args: "--features apple"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build Release
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.args }}

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: dev-bin-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/dev
